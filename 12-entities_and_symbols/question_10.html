<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol Reference</title>
</head>
<body>
    <section>
        <h1>Symbol Reference</h1>
        <p>Reserved characters: &lt; begins a tag, &gt; closes it, and &amp; joins two words.</p>
        <p>Currency symbol: &euro; is the symbol for the Euro.</p>
        <p>Mathematical symbol: &#x2211; represents summation.</p>
        <p>Arrow symbol: &rarr; shows a direction to the right.</p>
        <p>Legal symbol: &copy; identifies copyright.</p>
    </section>
</body>
</html>
