<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
</head>
<body>
    <p>Use &lt; to begin an HTML tag.</p>
    <p>Use &gt; to close an HTML tag.</p>
    <p>Use &amp; when writing an ampersand in text.</p>
    <p>The hexadecimal form &#x3C; also displays a less-than sign.</p>
    <p>The hexadecimal form &#x3E; also displays a greater-than sign.</p>
    <p>The hexadecimal form &#x26; also displays an ampersand.</p>
</body>
</html>
