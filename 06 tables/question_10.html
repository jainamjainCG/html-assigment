<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
  <caption>Monthly Sales Report</caption>

  <thead>
    <tr>
      <th scope="col">Category</th>
      <th scope="col">Product</th>
      <th scope="col">January</th>
      <th scope="col">February</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <th scope="rowgroup" rowspan="2">Fruit</th>
      <th scope="row">Apples</th>
      <td>120</td>
      <td>150</td>
    </tr>
    <tr>
      <th scope="row">Oranges</th>
      <td>100</td>
      <td>130</td>
    </tr>
    <tr>
      <th scope="row">Vegetables</th>
      <td colspan="3">No sales recorded this month.</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <th scope="row" colspan="2">Report Status</th>
      <td colspan="2">Complete</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
