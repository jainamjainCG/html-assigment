<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Code Elements</title>
    <style>
        pre {
            background-color: #1e1e1e;
            color: white;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        kbd {
            background-color: #f1f1f1;
            border: 1px solid #999;
            border-radius: 4px;
            padding: 3px 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Computer Code Elements</h1>
    <p>Use <code>display: flex;</code> to create a flex container.</p>
    <pre>if (score &gt;= 50) {
    console.log("Pass");
}</pre>
    <p>Press <kbd>Ctrl + S</kbd> to save your work.</p>
    <p>If something goes wrong, the program may show <samp>Error: File not found.</samp></p>
    <p>The value of <var>score</var> determines the result.</p>
</body>
</html>
